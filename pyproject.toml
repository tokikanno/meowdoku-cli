[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meowdoku-cli"
version = "0.1.0"
description = "Meowdoku in the terminal (curses, no dependencies)"
requires-python = ">=3.8"

[project.scripts]
meowdoku = "meowdoku.__main__:main"

[tool.setuptools]
packages = ["meowdoku"]
